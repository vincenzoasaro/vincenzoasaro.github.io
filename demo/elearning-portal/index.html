function arWireDnD(m) {
  var tbl = document.getElementById('ar_tbl');
  if (!tbl) return;
  var dragging = null;
  function orderNow() {
    var seq = [];
    tbl.querySelectorAll('tr.ar_row').forEach(function (tr) {
      seq.push(parseInt(tr.getAttribute('data-row'), 10));
    });
    return seq;
  }
  function sameOrder(a, b) {
    if (a.length !== b.length) return false;
    for (var i = 0; i < a.length; i++) {
      if (a[i] !== b[i]) return false;
    }
    return true;
  }
  function note2(html) {
    var box = document.getElementById('msg2');
    if (box) box.innerHTML = html;
  }
  var initial = orderNow(); // arm dragging only when the grab starts on the handle, so clicking Remove
  // or selecting text never starts a drag
  tbl.querySelectorAll('td.ar_handle').forEach(function (hd) {
    hd.addEventListener('mousedown', function () {
      hd.parentNode.setAttribute('draggable', 'true');
    });
  });
  tbl.addEventListener('mouseup', function () {
    tbl.querySelectorAll('tr.ar_row').forEach(function (tr) {
      tr.setAttribute('draggable', 'false');
    });
  });
  tbl.querySelectorAll('tr.ar_row').forEach(function (tr) {
    tr.addEventListener('dragstart', function (e) {
      dragging = tr;
      tr.classList.add('ar_drag');
      if (e.dataTransfer) {
        e.dataTransfer.effectAllowed = 'move';
        try {
          e.dataTransfer.setData('text/plain', tr.getAttribute('data-row'));
        } catch (ignore) {}
      }
    });
    tr.addEventListener('dragover', function (e) {
      e.preventDefault();
      if (e.dataTransfer) e.dataTransfer.dropEffect = 'move';
      if (!dragging || dragging === tr) return;
      var rect = tr.getBoundingClientRect();
      var before = e.clientY - rect.top < rect.height / 2;
      var parent = tr.parentNode;
      if (before) parent.insertBefore(dragging, tr);
      else parent.insertBefore(dragging, tr.nextSibling);
    });
    tr.addEventListener('dragend', function () {
      if (dragging) dragging.classList.remove('ar_drag');
      dragging = null;
      tr.setAttribute('draggable', 'false');
      var seq = orderNow();
      if (sameOrder(seq, initial)) return; // nothing actually moved
      note2('<div style="margin-top:12px;color:var(--muted)">Saving order…</div>');
      google.script.run
        .withSuccessHandler(function () {
          apmRoster(m);
        })
        .withFailureHandler(function (e2) {
          note2(
            '<div style="margin-top:12px;color:var(--warn)">Couldn\'t save the ' +
              'new order: ' +
              esc(String(e2 && e2.message ? e2.message : e2)) +
              '. Refreshing…</div>',
          );
          setTimeout(function () {
            apmRoster(m);
          }, 1500);
        })
        .reorderApmRoster(seq);
    });
  });
}

        '<div class="f" style="display:flex;gap:16px">' +
        '<div style="flex:1"><label>Week from</label><input type="date" id="cw_from" value="' +
        iso(mon) +
        '"></div>' +
        '<div style="flex:1"><label>to</label><input type="date" id="cw_to" value="' +
        iso(fri) +
        '"></div></div>';
      h += '<div class="eyebrow" style="padding-left:0;margin:18px 0 10px">Completion notes</div>';
      courses.forEach(function (c) {
        h +=
          '<div class="f"><label>' +
          esc(c.name) +
          ' — HC missing: ' +
          c.hcMissing +
          '</label>' +
          '<textarea id="cn_' +
          esc(c.id) +
          '" style="width:100%;height:60px;padding:8px;' +
          'border:1px solid var(--rule);border-radius:5px;font:inherit;font-size:12.5px"></textarea></div>';
      });
      h +=
        '<div class="eyebrow" style="padding-left:0;margin:18px 0 10px">Knowledge-base / Guru rows</div>' +
        '<div id="mx_rows"></div>' +
        '<div class="btns" style="margin-top:6px"><button class="s" onclick="mxAddRow()">+ Add a row</button></div>';
      h +=
        '<div class="btns" style="margin-top:20px"><button class="p" id="cw_go" onclick="crGenerate()">' +
        'Generate the report</button></div><div id="msg"></div></div><div id="cr_out"></div>';
      m.innerHTML = h;
      mxAddRow();
    })
    .withFailureHandler(err(m))
    .getClientReportNotesForm();
}
var MX_COUNT = 0;
function mxAddRow() {
  MX_COUNT++;
  var i = MX_COUNT;
  var wrap = document.getElementById('mx_rows');
  var row = document.createElement('div');
  row.style.cssText = 'display:flex;gap:8px;margin-bottom:8px';
  row.innerHTML =
    '<input type="text" id="mx_card_' +
    i +
    '" placeholder="Guru Card" style="flex:2;padding:6px;border:1px solid var(--rule);border-radius:5px">' +
    '<input type="date" id="mx_date_' +
    i +
    '" style="flex:1;padding:6px;border:1px solid var(--rule);border-radius:5px">' +
    '<input type="number" id="mx_rate_' +
    i +
    '" placeholder="%" style="flex:1;padding:6px;border:1px solid var(--rule);border-radius:5px">' +
    '<input type="text" id="mx_comment_' +
    i +
    '" placeholder="Comment" style="flex:2;padding:6px;border:1px solid var(--rule);border-radius:5px">';
  wrap.appendChild(row);
}
function crGenerate() {
  var notes = {};
  document.querySelectorAll('textarea[id^="cn_"]').forEach(function (el) {
    notes[el.id.slice(3)] = el.value;
  });
  var kbRows = [];
  for (var i = 1; i <= MX_COUNT; i++) {
    var card = document.getElementById('mx_card_' + i);
    if (!card || !card.value.trim()) continue;
    kbRows.push({
      card: card.value,
      date: document.getElementById('mx_date_' + i).value,
      rate: document.getElementById('mx_rate_' + i).value,
      comment: document.getElementById('mx_comment_' + i).value,
    });
  }
  document.getElementById('cw_go').disabled = true;
  msg(
    'ok',
    pick([
      'Assembling the report…',
      'Putting the week together…',
      'Building the client report…',
      'Piecing it all together…',
    ]),
  );
  google.script.run
    .withSuccessHandler(function (r) {
      msg('ok', 'Done.');
      document.getElementById('cr_out').innerHTML =
        '<div class="card" style="cursor:default;max-width:640px;margin-top:16px">' +
        'Written to <b>' +
        esc(r.tab) +
        '</b>.<br><br>' +
        '<a href="' +
        esc(r.url) +
        '" target="_blank">Open the report &rarr;</a></div>';
    })
    .withFailureHandler(function (e) {
      document.getElementById('cw_go').disabled = false;
      msg('err', e.message);
    })
    .generateWeeklyClientReport(
      {
        from: document.getElementById('cw_from').value,
        to: document.getElementById('cw_to').value,
      },
      notes,
      kbRows,
    );
}
function missingTrackerView(m) {
  m.innerHTML =
    '<div class="spin">' +
    pick(['Scanning the tracker…', "Finding who's missing…", 'Cross-checking the roster…']) +
    '</div>';
  google.script.run
    .withSuccessHandler(function (list) {
      var h =
        '<div class="head"><h1>Tracker check</h1><div class="lede">' +
        list.length +
        ' active in the Admin or Annotation doc, not in Mod level data. ' +
        'WFM and RTA are never flagged.</div>' +
        '<div class="btns"><button class="s" onclick="show(\'seetrackerexc\')">See exceptions &rarr;</button></div></div>';
      if (!list.length) {
        h += '<div class="panel">Nobody flagged. Everyone active is being tracked.</div>';
      } else {
        h += '<table><tr><th>Name</th><th></th></tr>';
        list.forEach(function (p, i) {
          h +=
            '<tr><td>' +
            esc(p.name) +
            '</td><td style="text-align:right" id="mt_' +
            i +
            '">' +
            '<button class="s" onclick="mtTakeOff(' +
            i +
            ",'" +
            esc(p.name).replace(/'/g, "\\'") +
            '\')">Take off the tracker</button></td></tr>';
        });
        h += '</table>';
      }
      m.innerHTML = h + '<div id="msg2"></div>';
    })
    .withFailureHandler(err(m))
    .getMissingFromTrackerList();
}
function mtTakeOff(i, name) {
  var cell = document.getElementById('mt_' + i);
  cell.innerHTML =
    '<input type="text" id="mt_reason_' +
    i +
    '" placeholder="Why?" ' +
    'style="padding:5px 7px;border:1px solid var(--rule);border-radius:4px;font-size:12px;width:160px">' +
    ' <button class="s" onclick="doMtTakeOff(' +
    i +
    ",'" +
    name.replace(/'/g, "\\'") +
    '\')">Confirm</button>';
}
function doMtTakeOff(i, name) {
  var reason = document.getElementById('mt_reason_' + i).value;
  if (!reason.trim()) {
    msg2err('Please say why.');
    return;
  }
  google.script.run
    .withSuccessHandler(function () {
      show('missingtracker');
    })
    .withFailureHandler(function (e) {
      msg2err(e.message);
    })
    .addToTrackerExceptions(name, reason);
}
function msg2err(t) {
  var el = document.getElementById('msg2');
  if (el) {
    el.className = 'msg err';
    el.textContent = t;
  }
} // Exclude one outstanding person from THIS course, from the detail screen.
// Mirrors "Add a one-off exclusion" — the server routes through the same path,
// so it lands in Exclusions, is Undo-able, and drops the person from the count.
// Reason is required, matching the form. Same two-step pattern as mtTakeOff.
function exclHere(i, courseId, name) {
  var cell = document.getElementById('xact_' + i);
  if (!cell) return;
  cell.innerHTML =
    '<input type="text" id="xreason_' +
    i +
    '" placeholder="Why are they out of scope?" ' +
    'style="padding:5px 7px;border:1px solid var(--rule);border-radius:4px;font-size:12px;width:210px">' +
    ' <button class="s" onclick="doExclHere(' +
    i +
    ",'" +
    esc(courseId) +
    "','" +
    name.replace(/'/g, "\\'") +
    '\')">Confirm</button>' +
    ' <button class="s" onclick="detail(\'' +
    esc(courseId) +
    '\')">Cancel</button>';
  var inp = document.getElementById('xreason_' + i);
  if (inp) inp.focus();
}
function doExclHere(i, courseId, name) {
  var reason = document.getElementById('xreason_' + i).value;
  if (!reason.trim()) {
    msg2err('Please give a reason.');
    return;
  }
  var cell = document.getElementById('xact_' + i);
  if (cell) cell.innerHTML = '<span style="font-size:12px;color:var(--muted)">Excluding…</span>';
  google.script.run
    .withSuccessHandler(function () {
      detail(courseId);
    })
    .withFailureHandler(function (e) {
      msg2err(e.message);
    })
    .excludeFromCourseDetail(courseId, name, reason);
}
function trackerExceptionsView(m) {
  m.innerHTML =
    '<div class="spin">' +
    pick(['Loading the exceptions…', "Pulling who's kept off…", 'Finding the opt-outs…']) +
    '</div>';
  google.script.run
    .withSuccessHandler(function (list) {
      var h =
        '<div class="head"><h1>Tracker exceptions</h1><div class="lede">' +
        list.length +
        ' kept off the tracker on purpose.</div>' +
        '<div class="btns"><button class="s" onclick="show(\'missingtracker\')">&larr; Missing from tracker</button></div></div>';
      if (!list.length) {
        h += '<div class="panel">Nobody on this list.</div>';
      } else {
        h += '<table><tr><th>Name</th><th>Reason</th><th>By</th><th>Date</th><th></th></tr>';
        list.forEach(function (t) {
          h +=
            '<tr><td>' +
            esc(t.name) +
            '</td><td style="color:var(--muted)">' +
            esc(t.reason) +
            '</td><td>' +
            esc(t.by) +
            '</td><td style="color:var(--muted)">' +
            esc(t.date) +
            '</td><td style="text-align:right" id="teact_' +
            t.row +
            '">' +
            '<button class="s" onclick="teRemove(' +
            t.row +
            ')">Remove</button></td></tr>';
        });
        h += '</table>';
      }
      m.innerHTML = h + '<div id="msg2"></div>';
    })
    .withFailureHandler(err(m))
    .getTrackerExceptions();
}
function teRemove(row) {
  var cell = document.getElementById('teact_' + row);
  if (!cell) {
    doTeRemove(row);
    return;
  }
  cell.innerHTML =
    '<span style="font-size:12px;color:var(--warn)">Remove? </span>' +
    '<button class="s" onclick="doTeRemove(' +
    row +
    ')">Yes</button> ' +
    '<button class="s" onclick="show(\'seetrackerexc\')">No</button>';
}
function doTeRemove(row) {
  google.script.run
    .withSuccessHandler(function () {
      show('seetrackerexc');
    })
    .withFailureHandler(function (e) {
      msg2err(e.message);
    })
    .removeTrackerException(row);
}
boot();

</script></body></html>
