<!DOCTYPE html><html><head><meta charset="utf-8"><title>eLearning Portal — portfolio demo</title><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Interactive demo of an eLearning completion-tracking portal built with Google Apps Script. Fictional data."><base target="_top"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet"><style>  :root {    --ink:#131a21; --muted:#64748b; --faint:#94a3b0;    --rule:#e2e8ed; --wash:#f6f8f9; --paper:#fff;    --safe:#0b6e4f; --live:#c03221; --warn:#b26b00; --keep:#1b4f8f; --unknown:#6b5b95;    --accent:var(--safe);    /* sidebar task-group accents (border colour / active-tile wash) */    --gv:#475569;  --gvbg:#eef1f4;   /* View            */    --g1:#6d54c9;  --g1bg:#f1eefc;   /* eLearnings      */    --g2:#3457b2;  --g2bg:#eef2fb;   /* People & access */    --g3:#8a3a7a;  --g3bg:#f7edf5;   /* Completion & exceptions */    --g4:#0e7a68;  --g4bg:#e6f5f1;   /* Reports         */    --g5:#b5651d;  --g5bg:#faf1e6;   /* Chasing         */    --g6:#c23b6d;  --g6bg:#fceef3;   /* Feedback        */  }  body.live { --accent:var(--live); }  * { box-sizing:border-box; margin:0; padding:0; }  body {    font-family:'IBM Plex Sans',system-ui,sans-serif; font-size:13px; color:var(--ink);    background:var(--wash); height:100vh; overflow:hidden;  }  .app { display:flex; height:100vh; }  /* ---------- rail ---------- */  .rail {    width:250px; flex:none; background:var(--paper);    border-right:1px solid var(--rule); display:flex; flex-direction:column;  }  .strip { background:var(--accent); color:#fff; padding:12px 16px 11px; }  .strip .m {    font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:12px;    letter-spacing:.15em; text-transform:uppercase;  }  .strip .d { font-size:11px; opacity:.8; margin-top:3px; overflow:hidden;              text-overflow:ellipsis; white-space:nowrap; }  .strip .w { margin-top:8px; padding-top:8px; font-size:11px;              border-top:1px solid rgba(255,255,255,.3); }  .who { padding:12px 16px; border-bottom:1px solid var(--rule); font-size:11px;         color:var(--muted); line-height:1.5; }  .who b { color:var(--ink); font-weight:500; }  .badge { display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:10px;           letter-spacing:.08em; text-transform:uppercase; padding:1px 6px;           border:1px solid var(--rule); border-radius:3px; margin-left:4px; }  nav { flex:1; overflow-y:auto; padding:12px 10px; }  .grp { margin-top:16px; }  .grp:first-child { margin-top:2px; }  .eyebrow { font-family:'IBM Plex Mono',monospace; font-size:10px; font-weight:600;             letter-spacing:.16em; text-transform:uppercase; color:var(--faint);             padding:0 6px 6px; }  .nav {    display:flex; gap:9px; align-items:flex-start; width:100%; text-align:left;    background:none; border:none; border-left:2px solid transparent; padding:7px 8px;    font:inherit; color:var(--ink); cursor:pointer; border-radius:0 5px 5px 0;    line-height:1.35;  }  .nav .ic { flex:none; width:15px; text-align:center; font-size:13px; line-height:1.5;             color:var(--faint); }  .nav .tx { flex:1; min-width:0; }  .nav:hover { background:var(--wash); }  .nav small { display:block; font-size:11px; color:var(--muted); margin-top:1px; }  /* per-group colour: quiet border + tinted icon; active tile fills with the group wash */  .nav.gv  { border-left-color:transparent; } .nav.gv  .ic { color:var(--gv); }  .nav.g1  { border-left-color:transparent; } .nav.g1  .ic { color:var(--g1); }  .nav.g2  { border-left-color:transparent; } .nav.g2  .ic { color:var(--g2); }  .nav.g3  { border-left-color:transparent; } .nav.g3  .ic { color:var(--g3); }  .nav.g4  { border-left-color:transparent; } .nav.g4  .ic { color:var(--g4); }  .nav.g5  { border-left-color:transparent; } .nav.g5  .ic { color:var(--g5); }  .nav.g6  { border-left-color:transparent; } .nav.g6  .ic { color:var(--g6); }  .nav.gv.on  { background:var(--gvbg); border-left-color:var(--gv); font-weight:500; }  .nav.g1.on  { background:var(--g1bg); border-left-color:var(--g1); font-weight:500; }  .nav.g2.on  { background:var(--g2bg); border-left-color:var(--g2); font-weight:500; }  .nav.g3.on  { background:var(--g3bg); border-left-color:var(--g3); font-weight:500; }  .nav.g4.on  { background:var(--g4bg); border-left-color:var(--g4); font-weight:500; }  .nav.g5.on  { background:var(--g5bg); border-left-color:var(--g5); font-weight:500; }  .nav.g6.on  { background:var(--g6bg); border-left-color:var(--g6); font-weight:500; }  /* Delete keeps its danger signal regardless of group */  .nav.harm .ic { color:var(--live); }  .nav.harm.on { background:#fdf3f2; border-left-color:var(--live); }  /* collapsible "Setup & admin" section */  .setup { display:flex; align-items:center; gap:9px; width:100%; background:none; border:none;           border-top:1px solid var(--rule); margin-top:16px; padding:12px 8px 4px; cursor:pointer;           font:inherit; color:var(--muted); }  .setup .ic { flex:none; width:15px; text-align:center; font-size:11px; color:var(--muted); }  .setup .lbl { flex:1; text-align:left; font-family:'IBM Plex Mono',monospace; font-size:10px;                font-weight:600; letter-spacing:.16em; text-transform:uppercase; }  .setup .cnt { font-size:10px; background:var(--wash); border:1px solid var(--rule);                border-radius:10px; padding:0 7px; }  .setup:hover { color:var(--ink); }  .setupitems { margin-top:4px; }  /* pinned utility buttons (Undo / Refresh) at the foot of the rail */  .railtools { display:flex; gap:8px; padding:10px 12px; border-top:1px solid var(--rule); }  .railtools:empty { display:none; }  .railtools button {    flex:1; display:flex; align-items:center; justify-content:center; gap:6px;    padding:7px 6px; font:inherit; font-size:12px; color:var(--ink);    background:var(--wash); border:1px solid var(--ru .02em; }  .sub { font-size:12px; color:var(--muted); }  .sub b { color:var(--ink); font-weight:500; }  .meter { display:flex; height:8px; border-radius:4px; overflow:hidden;           background:var(--rule); }  .seg { height:100%; }  .seg.ontime  { background:var(--safe); }  .seg.late    { background:var(--warn); }  .seg.overdue { background:var(--live); }  .seg.loa     { background:var(--keep); }  .seg.noid    { background:var(--unknown); }  .seg.pending { background:#cbd5dd; }  .seg.excused { background:#8bb8d9; }  .key { display:flex; flex-wrap:wrap; gap:12px; margin-top:9px; font-size:11px;         color:var(--muted); }  .key i { display:inline-block; width:8px; height:8px; border-radius:2px;           margin-right:4px; vertical-align:-1px; font-style:normal; }  .key b { color:var(--ink); font-weight:500; font-family:'IBM Plex Mono',monospace; }  .warnbar { margin-top:10px; padding:7px 10px; background:#fdf3f2; color:var(--live);             border-radius:4px; font-size:12px; }  /* ---------- table ---------- */  table { width:100%; border-collapse:collapse; background:var(--paper);          border:1px solid var(--rule); border-radius:6px; overflow:hidden; }  th { text-align:left; font-family:'IBM Plex Mono',monospace; font-size:10px;       font-weight:600; letter-spacing:.12em; text-transform:uppercase;       color:var(--muted); padding:9px 12px; background:var(--wash);       border-bottom:1px solid var(--rule); }  td { padding:9px 12px; border-bottom:1px solid var(--rule); font-size:13px; }  tr:last-child td { border-bottom:none; }  .pill { font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.06em;          text-transform:uppercase; padding:2px 7px; border-radius:3px; }  .pill.overdue { background:#fdecea; color:var(--live); }  .pill.pending { background:var(--wash); color:var(--muted); }  .pill.loa     { background:#eaf1fa; color:var(--keep); }  .pill.noid    { background:#f0edf6; color:var(--unknown); }  .pill.ok      { background:#e7f4ef; color:var(--safe); }  /* ---------- forms ---------- */  .panel { background:var(--paper); border:1px solid var(--rule); border-radius:7px;           padding:20px 22px; max-width:640px; }  .note { background:var(--wash); border-left:3px solid var(--muted); padding:9px 12px;          margin-bottom:18px; font-size:12px; color:var(--muted); line-height:1.55; }  .note.cuts  { border-left-color:var(--warn); background:#fdf7ee; color:var(--warn); }  .note.keeps { border-left-color:var(--keep); background:#eef3fa; color:var(--keep); }  .note.harm  { border-left-color:var(--live); background:#fdf3f2; color:var(--live); }  .f { margin-bottom:15px; }  .f label { display:block; font-size:12px; font-weight:500; margin-bottom:5px; }  .f input[type=text], .f input[type=date], .f select, .f textarea {    width:100%; padding:7px 9px; border:1px solid var(--rule); border-radius:5px;    font:inherit; font-size:13px; background:var(--paper); color:var(--ink);  }  .f input:focus, .f select:focus { outline:2px solid var(--keep); outline-offset:-1px; }  .f input[readonly] { background:var(--wash); color:var(--muted); }  .multi { border:1px solid var(--rule); border-radius:5px; padding:7px 9px;           max-height:130px; overflow-y:auto; }  .multi label { font-weight:400; margin:0; padding:2px 0; cursor:pointer;                 display:flex; gap:7px; align-items:center; }  .btns { display:flex; gap:8px; margin-top:20px; }  button.p, button.s {    padding:8px 18px; border:none; border-radius:5px; font:inherit; font-size:13px;    font-weight:500; cursor:pointer;  }  button.p { background:var(--ink); color:#fff; }  button.p.danger { background:var(--live); }  button.p:disabled { background:var(--rule); color:var(--faint); cursor:default; }  button.s { background:var(--wash); color:var(--ink); border:1px solid var(--rule); }  .msg { margin-top:14px; padding:10px 12px; border-radius:5px; font-size:12.5px;         line-height:1.6; white-space:pre-wrap; }  .msg.ok  { background:#e7f4ef; color:var(--safe); }  .msg.err { background:#fdecea; color:var(--live); }  pre.sum { background:var(--wash); border:1px solid var(--rule); border-radius:5px;            padding:12px 14px; font-family:'IBM Plex Mono',monospace; font-size:12px;            line-height:1.7; white-space:pre-wrap; }  .spin { color:var(--muted); padding:40px 0; }  a { color:var(--keep); }.navinfo {  position: absolute; top: 8px; right: 10px;  width: 16px; height: 16px; border-radius: 50%;  background: var(--rule); color: var(--muted);  font-size: 10px; font-family: monospace; font-style: italic;  display: flex; align-items: center; justify-content: center;  cursor: pointer; user-select: none;}.navinfo:hover { background: var(--keep); color: #fff; }/* inline "what do I do?" help — used in the Health check table *//* collapsible sections on the "How this works" guide */.gsec { background:var(--paper); border:1px solid var(--rule); border-radius:7px;        margin-bottom:10px; overflow:hidden; }.gsec-h { display:flex; align-items:center; gap:10px; width:100%; text-align:left;          background:none; border:none; padding:14px 16px; font:inherit; color:var(--ink);          cursor:pointer; }.gsec-h:hover { background:var(--wash); }.gsec-h .chev { flex:none; width:14px; color:var(--faint); font-size:11px; }.gsec-h .t { flex:1; font-size:14px; font-weight:500; }.gsec-h .s { font-size:11px; color:var(--muted); font-family:'IBM Plex Mono',monospace;             letter-spacing:.06em; text-transform:uppercase; }.gsec-b { display:none; padding:2px 18px 16px 40px; font-size:13px; line-height:1.7;          color:var(--ink); }.gsec-b p { margin-bottom:10px; }.gsec-b ul { margin:0 0 10px 18px; }.gsec-b li { margin-bottom:5px; }.gsec-b b { font-weight:600; }.gsec-b .warn2 { background:#fdf3f2; border-left:3px solid var(--live); padding:9px 12px;                 border-radius:4px; margin-bottom:10px; color:var(--live); }.gsec-b .tipbox { background:var(--wash); border-left:3px solid var(--keep); padding:9px 12px;                  border-radius:4px; margin-bottom:10px; }.gsec-b table { margin-bottom:10px; }.ihelp {  display: inline-flex; align-items: center; justify-content: center;  width: 15px; height: 15px; border-radius: 50%; margin-left: 7px;  background: var(--rule); color: var(--muted);  font-size: 10px; font-family: monospace; font-style: italic;  cursor: pointer; user-select: none; vertical-align: 1px;}.ihelp:hover { background: var(--keep); color: #fff; }.ihelp-pop {  display: none; margin-top: 7px; padding: 8px 11px; max-width: 460px;  background: var(--wash); border-left: 3px solid var(--keep); border-radius: 4px;  font-size: 12px; line-height: 1.55; color: var(--ink); font-weight: 400;}.navinfo-pop {  display: none; position: absolute; top: 30px; right: 8px; z-index: 20;  width: 220px; padding: 10px 12px; background: #fff;  border: 1px solid var(--rule); border-radius: 6px;  box-shadow: 0 4px 12px rgba(0,0,0,.12);  font-size: 12px; line-height: 1.5; color: var(--ink);}</style></head><body><div class="app">  <div class="rail">    <div class="strip">      <div class="m" id="mode">…</div>      <div class="d" id="doc"></div>      <div class="w" id="warn" style="display:none">Everything here changes real data.</div>      <div id="viewAsWrap"></div>    </div>    <div class="who" id="who"></div>    <nav id="nav"></nav>    <div class="railtools" id="railtools"></div>    <div class="foot">      Switch <code>Sandbox</code>/<code>Live</code> in the <b>Config</b> tab.<br>      Every action is recorded in <b>Log</b>.      <div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--rule);color:var(--faint)">        Developed and maintained with ❤️ by the Orientation team      </div>    </div>  </div>  <main id="main"><div class="spin">Loading…</div></main></div>
<script>
/* eLearning Portal — portfolio demo
 * mockdata.js — builds a fully fictional dataset shaped like the real sheets.
 * Every name, email, ID and team below is invented. Dates are generated
 * relative to "today" so the demo always looks current.                      */
(function (G) {
  'use strict';

  function rng(seed) {                       // mulberry32 — deterministic
    return function () {
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const DAY = 86400000;
  function parseISO(s) { const p = s.split('-'); return Date.UTC(+p[0], +p[1] - 1, +p[2]); }
  function iso(ms) { return new Date(ms).toISOString().slice(0, 10); }
  function addDays(s, n) { return iso(parseISO(s) + n * DAY); }

  const FIRST = ['Amara','Bruno','Chiara','Dmitri','Elif','Felipe','Grace','Hiro','Ines','Jonah','Kavya','Lena',
    'Mateo','Nadia','Omar','Priya','Quentin','Rosa','Santiago','Tara','Umar','Vera','Wes','Ximena','Yusuf','Zoe',
    'Aiden','Bea','Caleb','Dalia','Emeka','Freya','Gabriel','Hana','Ivan','Jade','Kofi','Leila','Marco','Noor',
    'Oscar','Paula','Rafael','Sana','Tomas','Uma','Victor','Wren','Yara','Zane'];
  const LAST = ['Abara','Bianchi','Castillo','Dubois','Eriksen','Ferreira','Gallo','Haddad','Ito','Jansen','Kowalski',
    'Lindqvist','Moreau','Nakamura','Okafor','Petrov','Quinn','Rinaldi','Sato','Tanaka','Ueda','Varga','Weber',
    'Xu','Yilmaz','Zielinski','Almeida','Brennan','Costa','Delgado','Esposito','Fischer','Gomez','Holm','Iqbal',
    'Juarez','Keller','Lopes','Mensah','Novak','Ortega','Pereira','Rossi','Silva','Thorne','Vidal','Walsh','Young'];

  const TEAMS = [
    { team: 'Team Aurora',   lob: 'Billing' },
    { team: 'Team Borealis', lob: 'Account Access' },
    { team: 'Team Cirrus',   lob: 'Technical' },
    { team: 'Team Delta',    lob: 'Partner Care' },
    { team: 'Team Ember',    lob: 'Trust & Safety' },
  ];
  const ADVISOR_LOBS = TEAMS.map(t => t.lob);

  function build(todayISO) {
    const R = rng(20261010);
    const pick = a => a[Math.floor(R() * a.length)];
    const chance = p => R() < p;
    const usedNames = {};
    function newName() {
      for (;;) {
        const n = pick(FIRST) + ' ' + pick(LAST);
        if (!usedNames[n]) { usedNames[n] = 1; return n; }
      }
    }
    let uidN = 0;
    function newUid() {
      uidN++;
      let h = '';
      for (let i = 0; i < 10; i++) h += '0123456789abcdef'[Math.floor(R() * 16)];
      return 'sj' + h;
    }
    function emailOf(name) {
      return name.toLowerCase().replace(/[^a-z ]/g, '').trim().replace(/\s+/g, '.') + '@example.com';
    }
    function slackOf(name) { const p = name.split(' '); return p[0] + ' ' + p[p.length - 1].charAt(0) + '.'; }

    const today = todayISO;
    // ------------------------------------------------------------------ people
    const people = [];      // Mod level data rows
    const adminDoc = [];    // Admin doc "Mod List" rows (active first, then below the separator)
    function addPerson(o) {
      const p = Object.assign({
        uid: newUid(), email: emailOf(o.name), slack: slackOf(o.name), manager: '', team: '',
        start: addDays(today, -Math.floor(120 + R() * 600)), site: pick(['Remote — EMEA', 'Remote — LATAM', 'Remote — APAC']),
      }, o);
      people.push(p);
      return p;
    }
    const managers = [];
    const opsLead = addPerson({ name: newName(), role: 'PM', lob: 'Operations', team: 'Operations' });
    TEAMS.forEach(function (t) {
      const pm = addPerson({ name: newName(), role: 'PM', lob: t.lob, team: t.team, manager: opsLead.name });
      const apms = [0, 1].map(function () {
        return addPerson({ name: newName(), role: 'APM', lob: t.lob, team: t.team, manager: pm.name });
      });
      managers.push(pm, apms[0], apms[1]);
      const n = 26 + Math.floor(R() * 8);
      for (let i = 0; i < n; i++) {
        addPerson({ name: newName(), role: chance(0.08) ? 'LEAD' : 'MOD', lob: t.lob, team: t.team,
                    manager: apms[i % 2].name });
      }
    });
    // the Orientation team (admins) — the demo user is Alex Morgan
    usedNames['Alex Morgan'] = usedNames['Sam Okoye'] = 1;
    const alex = addPerson({ name: 'Alex Morgan', role: 'LIT', lob: 'Orientation', team: 'Orientation',
                             email: 'alex.morgan@example.com', start: addDays(today, -700) });
    addPerson({ name: 'Sam Okoye', role: 'LIT', lob: 'Orientation', team: 'Orientation', start: addDays(today, -500) });

    // recent hires (still nesting) — they arrive after some courses were published
    const advisors = people.filter(p => p.role === 'MOD');
    const nesting = [];
    for (let i = 0; i < 6; i++) {
      const p = advisors[7 + i * 23];
      p.start = addDays(today, -Math.floor(5 + R() * 14));
      nesting.push(p);
    }
    // no Skilljar ID yet (shows as "?")
    const noId = [advisors[19], advisors[71], advisors[118]];
    noId.forEach(p => { p.uid = ''; });

    // name-variant mismatch: Mod level data spelling differs from the Admin doc
    usedNames['Ana de la Cruz'] = 1;
    const ana = advisors[40];
    const anaAdminName = 'Ana De La Cruz Ramos';
    ana.name = 'Ana de la Cruz'; ana.email = 'ana.delacruz@example.com'; ana.slack = 'Ana D.';

    // Admin doc rows for everyone tracked
    people.forEach(function (p) {
      adminDoc.push({ name: p === ana ? anaAdminName : p.name, slack: p.slack, role: p.role, lob: p.lob,
                      team: p.team, email: p.email, tableau: p === ana ? anaAdminName : p.name, active: true });
    });
    // people in the Admin doc who are NOT tracked in Mod level data
    const notTracked = [];
    ['RTA', 'RTALEAD'].forEach(function (role) {
      const n = newName();
      notTracked.push({ name: n, slack: slackOf(n), role: role, lob: 'WFM', team: 'Workforce', email: emailOf(n), tableau: n, active: true });
    });
    ['WFMPM', 'WFSCHEDULER'].forEach(function (role) {
      const n = newName();
      notTracked.push({ name: n, slack: slackOf(n), role: role, lob: 'WFM', team: 'Workforce', email: emailOf(n), tableau: n, active: true });
    });
    const missingA = newName(), missingB = newName(), contractor = newName(), shadow = newName();
    notTracked.push({ name: missingA, slack: slackOf(missingA), role: 'MOD', lob: 'Billing', team: 'Team Aurora', email: emailOf(missingA), tableau: missingA, active: true });
    notTracked.push({ name: missingB, slack: slackOf(missingB), role: 'MOD', lob: 'Technical', team: 'Team Cirrus', email: emailOf(missingB), tableau: missingB, active: true });

    const C = [

    // ------------------------------------------------------------ exclusions
    const leads = people.filter(p => p.role === 'LEAD');

    leave(advisors[11], addDays(today, -9), addDays(today, 12), 'Yes', 'Parental leave');

    function setNames(sets) {

        if (!p.uid) return;

        let when = '';
        if (c.id === 'PRIV_2026' && (p === excusedA || p === excusedB)) {

        } else if (done) {
          const lastPossible = Math.min(parseISO(today), parseISO(c.deadline));
          const span = Math.max(1, Math.round((lastPossible - parseISO(c.published)) / DAY));
          if (spec.late && chance(spec.late) && c.deadline < today) {
            const gap = Math.round((parseISO(today) - parseISO(c.deadline)) / DAY);
            when = addDays(c.deadline, 1 + Math.floor(R() * Math.max(1, Math.min(gap, 10) - 1)));
          } else {
            when = iso(parseISO(c.published) + (1 + Math.floor(R() * span)) * DAY);
          }
          if (when > today) when = today;
        }
        const hh = String(8 + Math.floor(R() * 10)).padStart(2, '0'), mm = String(Math.floor(R() * 60)).padStart(2, '0');
        rows.push({ name: p.name, uid: p.uid, email: p.email, pct: done ? 100 : 0, completedAt: done ? when + ' ' + hh + ':' + mm : '' });

    // manual completions — person-verified completions the export missed
    manual.push({ courseId: 'REFUND_POLICY', name: advisors[5].name, date: addDays(registry[2].deadline, -2), reason: 'Shared a screen recording of the completion page', by: 'alex.morgan@example.com' });
    const escMan = plannedManual['ESC_MATRIX_V3'][0];

    // Alex: done with privacy, still to do tone & voice
    const alexPriv = exportsByTab[registry[0].tabName].find(r => r.uid === alex.uid);

    // archived courses: their export tabs live in the archive spreadsheet
    const archive = {};
    registry.forEach(function (c) {
      if (c.status === 'Archived') { archive[c.tabName] = exportsByTab[c.tabName]; delete exportsByTab[c.tabName]; }
    });

    // ------------------------------------------------------------ portal tabs
    const apms = managers.filter(m => m.role === 'APM');
    const overrides = [
      { email: 'sam.okoye@example.com', role: 'admin', scope: '', reason: 'Second admin for the portal', addedBy: 'alex.morgan@example.com' },
      { email: apms[3].email, role: 'manager', scope: apms[3].name + ', ' + apms[2].name, reason: 'Covering both Borealis APMs while one is on leave', addedBy: 'alex.morgan@example.com' },
      { email: emailOf(missingB), role: 'none', scope: '', reason: 'Account under review — access paused', addedBy: 'sam.okoye@example.com' },
    ];
    const trackerExc = [
      { name: contractor, reason: 'Short-term contractor — not on the client training plan', by: 'alex.morgan@example.com', date: addDays(today, -21) },
      { name: shadow, reason: 'Shadowing Trust & Safety for two weeks, tracked in home LOB', by: 'sam.okoye@example.com', date: addDays(today, -6) },
    ];
    const apmRoster = [apms[0], apms[2], apms[5], apms[7], apms[8]].map(function (m, i) {
      return { name: m.name, team: m.team, note: i === 1 ? 'Joined the roster this quarter' : '' };
    });
    const clientRoster = ['PRIV_2026', 'ESC_MATRIX_V3', 'REFUND_POLICY', 'ACCT_RECOVERY'];
    const feedback = [
      { when: addDays(today, -1) + ' 16:42', category: 'Idea', text: 'Could the course detail page show how many people finished in the last 7 days? Useful for the Monday huddle.' },
      { when: addDays(today, -4) + ' 09:12', category: 'General', text: 'The "My eLearnings" page is so much easier than asking my APM what I still owe. Thank you!' },
      { when: addDays(today, -11) + ' 13:05', category: 'Confusing', text: 'I was on leave and still showed as overdue for a day — I think my leave was added after the report ran?' },
      { when: addDays(today, -19) + ' 11:30', category: 'Bug', text: 'Download as a sheet took a while the first time, then worked fine.' },
    ];
    const template = {
      subject: 'Reminder: {{course}} is overdue',
      fromName: 'Orientation Team',
      body: 'Hi {{name}},\n\nOur records show that "{{course}}" was due on {{deadline}} and is now {{days_overdue}} days overdue.\n\n' +
            'You can open it here: {{link}}\n\nIf you have already completed it, reply to this email and we will check the record.\n\nThanks,\nThe Orientation Team',
    };
    const lastLoa = loa[loa.length - 1];
    const log = [
      { ts: addDays(today, -2) + ' 05:00:12', user: 'trigger', action: 'Refresh mirrors', details: '_Admin_Mirror: OK; _Annot_Mirror: OK', result: 'OK' },
      { ts: addDays(today, -1) + ' 05:00:09', user: 'trigger', action: 'Refresh mirrors', details: '_Admin_Mirror: OK; _Annot_Mirror: OK', result: 'OK' },
      { ts: addDays(today, -1) + ' 10:22:41', user: 'alex.morgan@example.com', action: 'Import Skilljar export', details: 'ACCT_RECOVERY -> "Acct recovery export": rows imported', result: 'OK' },
      { ts: today + ' 05:00:10', user: 'trigger', action: 'Refresh mirrors', details: '_Admin_Mirror: OK; _Annot_Mirror: OK', result: 'OK' },
      { ts: today + ' 08:47:03', user: 'alex.morgan@example.com', action: 'Mark someone on leave',
        details: lastLoa.name + ' on leave ' + lastLoa.from + ' to ' + lastLoa.to + ' (official: ' + lastLoa.official + ')', result: 'OK' },
    ];
    // Annotation doc ("Active Mods") — a second view of the active roster
    const annot = people.filter(p => p.lob !== 'Orientation').map(p => ({
      name: p === ana ? anaAdminName : p.name, oktaEmail: p.email, role: p.role, lob: p.lob, site: p.site, start: p.start,
    }));

    return {
      version: 1, generatedFor: today,
      me: { email: alex.email, name: alex.name },
      config: { MODE: 'SANDBOX', SANDBOX_DOC_ID: 'demo-sandbox-tracking-doc', LIVE_DOC_ID: 'demo-live-tracking-doc',
                ADMIN_DOC_ID: 'demo-admin-doc', ANNOT_DOC_ID: 'demo-annotation-doc', LATE_REPORT_ID: 'demo-late-reports',
                APM_REPORT_ID: 'demo-apm-breakdown', CLIENT_REPORT_ID: 'demo-client-report', SANDBOX_ARCHIVE_ID: 'demo-archive',
                MIRROR_REFRESHED: today + ' 05:00', ACCESS_VERSION: 14 },
      docName: 'eLearning Tracker — SANDBOX copy',
      people: people, adminDoc: adminDoc, annot: annot, registry: registry, exports: exportsByTab, archive: archive,
      exclSets: exclSets, courseExcl: courseExcl, loa: loa, manual: manual, overrides: overrides,
      trackerExc: trackerExc, apmRoster: apmRoster, clientRoster: clientRoster, feedback: feedback,
      template: template, log: log, sent: [],
    };
  }

  G.ELP_MOCK = { build: build, parseISO: parseISO, iso: iso, addDays: addDays, DAY: DAY };
})(typeof window !== 'undefined' ? window : globalThis);

<script>
/* eLearning Portal — portfolio demo
 * server.js — an in-browser stand-in for Code.gs.
 * Implements every server function the portal calls, against the mock
 * dataset, with the same return shapes and the same rules as the real
 * Apps Script backend (assignment, leave, exclusions, manual completions,
 * late-but-excused, access tiers, undo guard, import sanity check…).          */
(function (G) {
  'use strict';
  const M = G.ELP_MOCK;
  const DAY = M.DAY;
  let S = null;            // state
  let TODAY = '';
  let VERSION = 0;         // bumps on every write so the host can persist
  const hooks = { makeUrl: function () { return '#'; } };

  // ------------------------------------------------------------ small helpers
  const p2 = n => String(n).padStart(2, '0');
  function nowStamp() {
    const d = new Date();
    return TODAY + ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes()) + ':' + p2(d.getSeconds());
  }
  function daysBetween(a, b) { return Math.round((M.parseISO(b) - M.parseISO(a)) / DAY); }
  function err(m) { return new Error(m); }
  function touch() { VERSION++; }
  function log_(action, details, result) {
    S.log.push({ ts: nowStamp(), user: S.me.email, action: action, details: details, result: result || 'OK' });
    touch();
  }
  function colLetter(n) { let s = ''; while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; }
  const realMe = () => ({ email: S.me.email, role: 'admin', managers: [], self: S.me.name, why: 'Orientation' });
  function requireAdmin_() { /* the demo visitor is always the admin; viewing-as only changes what is shown */ }

  function course(id) {
    const want = String(id || '').trim().toUpperCase();
    const c = S.registry.find(r => r.id === want);
    if (!c) throw err('Course not found: ' + id);
    return c;
  }
  function loadCourse_(id) {
    const c = course(id);
    return {
      _row: S.registry.indexOf(c) + 2, id: c.id, fullName: c.fullName, shortName: c.shortName, link: c.link,
      desc: c.desc, minutes: c.minutes === '' ? '' : String(c.minutes || ''), timing: c.timing, timingDetail: c.timingDetail,
      advisorNotes: c.advisorNotes, deadline: c.deadline, audience: c.audience.slice(), sets: c.sets.slice(),
      period: c.period, tabName: c.tabName, status: c.status,
    };
  }
  function exportRows(c) {
    if (Object.prototype.hasOwnProperty.call(S.exports, c.tabName)) return S.exports[c.tabName];
    if (Object.prototype.hasOwnProperty.call(S.archive, c.tabName)) return S.archive[c.tabName];
    return null;
  }
  function inSet(c, name) { return c.sets.length && S.exclSets.some(r => c.sets.indexOf(r.set) !== -1 && r.name === name); }
  function oneOff(c, name) { return S.courseExcl.some(r => r.courseId === c.id && r.name === name); }
  /** The Mod-level-data cell: '' not assigned, '?' no Skilljar ID, true done, false not done. */
  function cell(c, p) {
    if (!c.audience.length || c.audience.indexOf(p.lob) === -1) return '';
    if (c.published && p.start > c.published) return '';
    if (inSet(c, p.name) || oneOff(c, p.name)) return '';
    if (!p.uid) return '?';
    const rows = exportRows(c);
    if (!rows) return false;
    const r = rows.find(x => x.uid === p.uid);
    return !!(r && Number(r.pct) > 0);
  }
  function doneAt(c, uid) {
    const rows = exportRows(c) || [];
    const r = rows.find(x => x.uid === uid);
    return r && r.completedAt ? String(r.completedAt).slice(0, 10) : '';
  }
  const manualOf = (cid, name) => S.manual.find(m => m.courseId === cid && m.name === name);
  const loaOf = name => S.loa.filter(l => l.name === name);
  const loaCurrent = name => loaOf(name).some(l => l.from <= TODAY && TODAY <= l.to);
  function fullyCovered(deadline, completed, ranges) {
    if (!deadline || !completed || completed <= deadline || !ranges.length) return false;
    for (let d = M.addDays(deadline, 1); d <= completed; d = M.addDays(d, 1)) {
      if (!ranges.some(r => r.from <= d && d <= r.to)) return false;
    }
    return true;
  }

  // -------------------------------------------------------------- identity
  function managersInData() { const s = {}; S.people.forEach(p => { if (p.manager) s[p.manager] = 1; }); return Object.keys(s); }
  function teamOf_(who) {
    if (!who) return [];
    const all = managersInData();
    if (all.indexOf(who) !== -1) return [who];
    const norm = s => { const p = String(s).trim().toLowerCase().split(/\s+/); return p[0] ? p[0] + ' ' + (p.length > 1 ? p[p.length - 1].charAt(0) : '') : ''; };
    const hits = all.filter(m => norm(m) === norm(who));
    return hits.length === 1 ? hits : [];
  }
  function viewAsMe_(me, viewAs, person) {
    if (!(viewAs && viewAs !== 'admin')) return me;
    if (viewAs === 'manager') {
      const who = person || 'DEMO';
      return { email: me.email, role: 'manager', managers: teamOf_(who), self: me.self, why: 'Viewing as manager: ' + who + ' (simulated)' };
    }
    if (viewAs === 'rta') return { email: me.email, role: 'rta', managers: [], self: me.self, why: 'Viewing as RTA (simulated)' };
    if (viewAs === 'self') return { email: me.email, role: 'self', managers: [], self: me.self, why: 'Viewing as self (simulated)' };
    return me;
  }
  function visible(me, p) {
    if (me.role === 'admin') return true;
    if (me.role === 'manager') return me.managers.indexOf(p.manager) !== -1;
    if (me.role === 'self') return p.name === me.self;
    return false;
  }

  // --------------------------------------------------------------- health
  function adminActiveNames() { const o = {}; S.adminDoc.forEach(r => { if (r.active) o[r.name] = 1; }); return o; }
  function healthChecks() {
    const names = {}; S.people.forEach(p => { names[p.name] = (names[p.name] || 0) + 1; });
    const active = adminActiveNames();
    const inactive = {}; S.adminDoc.forEach(r => { if (!r.active) inactive[r.name] = 1; });
    const out = [];
    const add = (check, bad, okDetail, badDetail) => out.push({
      check: check, ok: !bad.length, status: bad.length ? '\u26A0 ' + bad.length : '\u2713 OK',
      detail: bad.length ? (badDetail || '') + bad.join(', ') : okDetail,
    });
    const sepRow = S.adminDoc.filter(r => r.active).length + 2;
    add('Separator row found', [], 'Row ' + sepRow + ' of _Admin_Mirror');
    add('Admin doc columns', [], 'Role, LOB, Team and email columns found by header');
    add('Annotation doc columns', [], 'Role landed in the canonical column');
    add('Registry tabs exist', S.registry.filter(c => c.status === 'Active' && exportRows(c) === null).map(c => c.tabName),
        'Every active course has its export tab', 'Missing: ');
    add('People not found', S.people.filter(p => !active[p.name] && !inactive[p.name]).map(p => p.name),
        'Everyone in Mod level data is in the Admin doc', 'Not in the Admin doc: ');
    add('People offboarded', S.people.filter(p => inactive[p.name]).map(p => p.name), 'Nobody who has left is still counted');
    add('Missing Skilljar User ID', S.people.filter(p => !p.uid).map(p => p.name), 'Everyone has a Skilljar ID', 'No ID: ');
    add('Stale exclusion names (sets)', S.exclSets.filter(r => !names[r.name]).map(r => r.name), 'All set members still exist', '');
    add('Stale exclusion names (one-offs)', S.courseExcl.filter(r => !names[r.name]).map(r => r.name), 'All one-offs still exist', '');
    add('Unknown Course IDs in Mod level data', [], 'Every column maps to a registry row');
    add('Duplicate Mod names', Object.keys(names).filter(n => names[n] > 1), 'No duplicates', '');
    add('Corrupted names (HTML entities)', S.people.filter(p => /&[a-z#0-9]+;/i.test(p.name)).map(p => p.name), 'Clean', '');
    return out;
  }
  function mirrorAgeHours() {
    const t = S.config.MIRROR_REFRESHED;
    if (!t) return null;
    const d = new Date(t.replace(' ', 'T'));
    return Math.max(0, Math.round((Date.now() - d.getTime()) / 3600000));
  }

  // ------------------------------------------------------- course statistics
  function statsFor(c, me) {
    const s = { assigned: 0, done: 0, onTime: 0, late: 0, lateExcused: 0, overdue: 0, loa: 0, noId: 0, pending: 0 };
    const past = c.deadline && TODAY > c.deadline;
    const outstanding = [], completed = [];
    S.people.forEach(function (p) {
      if (me && !visible(me, p)) return;
      const x = cell(c, p);
      if (x === '') return;
      s.assigned++;
      const man = manualOf(c.id, p.name);
      let st = 'ontime', date = '';
      if ((man && x !== true) || x === true) {
        s.done++;
        date = man && x !== true ? man.date : doneAt(c, p.uid);
        if (date && c.deadline && date > c.deadline) {
          if (fullyCovered(c.deadline, date, loaOf(p.name))) { s.lateExcused++; st = 'excused'; }
          else { s.late++; st = 'late'; }
        } else s.onTime++;
        completed.push({ name: p.name, lob: p.lob, manager: p.manager, date: date, state: st, manual: !!(man && x !== true) });
        return;
      }
      let state = past ? 'overdue' : 'pending', note = '';
      if (x === '?') { s.noId++; state = 'noid'; note = 'No Skilljar ID \u2014 we cannot tell'; }
      else if (loaCurrent(p.name)) {
        s.loa++; state = 'loa';
        const l = loaOf(p.name).find(r => r.from <= TODAY && TODAY <= r.to);
        note = (l.official === 'Yes' ? 'On leave' : 'Absent') + (l.reason ? ' \u2014 ' + l.reason : '');
      } else if (past) s.overdue++; else s.pending++;
      outstanding.push({ name: p.name, lob: p.lob, manager: p.manager, email: p.email, state: state, note: note, slack: p.slack });
    });
    return { stats: s, outstanding: outstanding, completed: completed };
  }

  // ======================================================== the API (Code.gs)
  const API = {};

  API.getPortalData = function (viewAs, viewAsPerson) {
    const me = realMe();
    const shown = viewAsMe_(me, viewAs, viewAsPerson);
    const health = { master: '', failing: [] };
    healthChecks().forEach(h => { if (!h.ok) health.failing.push({ check: h.check, status: h.status, detail: h.detail }); });
    const age = mirrorAgeHours();
    if (age !== null && age > 48) health.failing.push({ check: 'Mirror refresh', status: '\u26A0 stale', detail: 'Last refreshed ' + age + ' hours ago. The daily trigger may have failed.' });
    health.master = health.failing.length ? health.failing.length + ' CHECKS FAILING' : 'ALL CHECKS PASSING';
    const courses = S.registry.map(function (r) {
      const c = { id: r.id, name: r.fullName, link: r.link, desc: r.desc, minutes: r.minutes || '', timing: r.timing,
        timingDetail: r.timingDetail, deadline: r.deadline, period: r.period, audience: r.audience.join(', '), status: r.status,
        tabName: r.tabName, broken: '', daysLeft: r.deadline ? daysBetween(TODAY, r.deadline) : null };
      const rows = exportRows(r);
      if (rows === null || (rows.length === 0 && r.status === 'Active')) c.broken = 'No export in "' + r.tabName + '"';
      Object.assign(c, statsFor(r, shown).stats);
      return c;
    });
    courses.sort(function (a, b) {
      const aa = a.status.toLowerCase() === 'active' ? 0 : 1, bb = b.status.toLowerCase() === 'active' ? 0 : 1;
      if (aa !== bb) return aa - bb;
      return (b.deadline || '').localeCompare(a.deadline || '');
    });
    return { me: shown, mode: S.config.MODE, doc: S.docName, health: health, courses: courses,
             people: S.people.filter(p => visible(shown, p)).length, realRole: me.role };
  };

  API.getCourseDetail = function (courseId, viewAs, viewAsPerson) {
    const shown = viewAsMe_(realMe(), viewAs, viewAsPerson);
    const c = course(courseId);
    const r = statsFor(c, shown);
    const order = { overdue: 0, noid: 1, pending: 2, loa: 3 };
    r.outstanding.sort((a, b) => (order[a.state] - order[b.state]) || a.name.localeCompare(b.name));
    r.completed.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
    return { course: loadCourse_(c.id), people: r.outstanding.map(o => { const x = Object.assign({}, o); delete x.slack; return x; }),
             completed: r.completed, stats: r.stats };
  };

  API.getMyLearnings = function () {
    const me = realMe();
    const p = S.people.find(x => x.name === me.self);
    if (!p) throw err('We could not find your training record. Please contact the Orientation team so they can link your account.');
    const todo = [], done = [];
    S.registry.forEach(function (c) {
      if (c.status !== 'Active') return;
      const x = cell(c, p);
      if (x === '') return;
      const man = manualOf(c.id, p.name);
      if (x !== true && man) {
        done.push({ name: c.fullName, deadline: c.deadline, doneDate: man.date, onTime: man.date <= c.deadline, manuallyVerified: true });
        return;
      }
      if (x === true) {
        const d = doneAt(c, p.uid);
        done.push({ name: c.fullName, deadline: c.deadline, doneDate: d, onTime: d ? d <= c.deadline : null });
      } else {
        todo.push({ name: c.fullName, link: c.link, deadline: c.deadline, desc: c.desc, minutes: c.minutes, timing: c.timing,
          timingDetail: c.timingDetail, advisorNotes: c.advisorNotes, overdue: TODAY > c.deadline,

    todo.sort((a, b) => (a.deadline || '').localeCompare(b.deadline || ''));

  API.getVerifyReport = function () {
    const issues = [];
    S.registry.forEach(function (c) {
      if (c.status !== 'Active') return;
      const p = [];
      const rows = exportRows(c);
      if (!c.tabName) p.push('The tab name is empty');
      else if (rows === null) p.push('There is no tab called "' + c.tabName + '"');
      else if (!rows.length) p.push('"' + c.tabName + '" is empty \u2014 the export has not been pasted');

    });
    return issues;

  API.getFormSpec = function (name) {
    const spec = JSON.parse(JSON.stringify(FORMS[name]));
    spec.mode = S.config.MODE;
    const lists = {};
    spec.fields.forEach(function (f) {
      if (f.source === 'courses') lists.courses = listCourseIds(false);
      if (f.source === 'mods') lists.mods = listModNames();
      if (f.source === 'sets') lists.sets = listSets();

    spec.lists = lists;

  API.portalListCourses = activeOnly => listCourseIds(!!activeOnly);
  API.portalGetCourse = id => loadCourse_(id);

  function tabExists(name) { return Object.prototype.hasOwnProperty.call(S.exports, name) || Object.prototype.hasOwnProperty.call(S.archive, name); }
  function nextColumnLetter() { return colLetter(9 + S.registry.length + 1); }
  function minutesProblem(v) {
    if (v.minutes && String(v.minutes).trim() !== '') {
      const n = Number(v.minutes);
      if (isNaN(n) || n < 0 || !Number.isInteger(n)) return 'Expected time must be a whole number of minutes (e.g. 15), not "' + v.minutes + '"';
    }
    return '';
  }
  function reviewCourse(v) {
    const problems = [];
    const id = String(v.id || '').trim().toUpperCase();
    if (!id) problems.push('Course ID is empty');
    else if (!/^[A-Z0-9_]+$/.test(id)) problems.push('Course ID must be A-Z, 0-9 and underscores only');
    else if (listCourseIds(false).indexOf(id) !== -1) problems.push('Course ID "' + id + '" is already in the registry');
    if (!String(v.fullName || '').trim()) problems.push('Full name is empty');
    if (!String(v.shortName || '').trim()) problems.push('Short name is empty');
    if (!String(v.deadline || '').trim()) problems.push('Deadline is empty');
    if (!String(v.period || '').trim()) problems.push('Period is empty');
    const mp = minutesProblem(v); if (mp) problems.push(mp);
    const tabName = String(v.tabName || '').trim();
    if (!tabName) problems.push('Tab name is empty');
    else if (tabExists(tabName)) problems.push('A tab called "' + tabName + '" already exists');
    const picked = v.audience || [];
    if (!picked.length) problems.push('No audience selected - this is the denominator');
    if (problems.length) return { ok: false, problems: problems };
    const hc = S.people.filter(p => picked.indexOf(p.lob) !== -1).length;
    return { ok: true, summary:
      'Course ID:   ' + id + '\nFull name:   ' + v.fullName + '\nDeadline:    ' + v.deadline + '\nAudience:    ' + picked.join(', ') +
      '\nExclusions:  ' + ((v.sets || []).join(', ') || 'none') + '\nTab name:    ' + tabName + '\n\n' +
      'HC assigned: about ' + hc + ' people (before exclusions)\n\nWill create the tab, add column ' + nextColumnLetter() +
      ' to Mod level data,\nand add a row to Overall Site completion.' };
  }
  function reviewEdit(v) {
    if (!v || !v.id) throw err('The form sent no data.');
    const old = loadCourse_(v.id);
    const problems = [];
    if (!String(v.fullName || '').trim()) problems.push('Full name is empty');
    if (!String(v.shortName || '').trim()) problems.push('Short name is empty');
    if (!String(v.deadline || '').trim()) problems.push('Deadline is empty');
    if (!String(v.period || '').trim()) problems.push('Period is empty');
    const mp = minutesProblem(v); if (mp) problems.push(mp);
    const newTab = String(v.tabName || '').trim();
    if (!newTab) problems.push('Tab name is empty');
    else if (newTab !== old.tabName && tabExists(newTab)) problems.push('A tab called "' + newTab + '" already exists');
    const picked = v.audience || [];
    if (!picked.length) problems.push('No audience selected \u2014 this is the denominator');
    if (problems.length) return { ok: false, problems: problems };
    let hcOld = 0, hcNew = 0;
    S.people.forEach(p => { if (old.audience.indexOf(p.lob) !== -1) hcOld++; if (picked.indexOf(p.lob) !== -1) hcNew++; });
    const changes = [];
    const cmp = (label, a, b) => { if (String(a) !== String(b)) changes.push('  ' + label + ':\n      was: ' + (a || '(empty)') + '\n      now: ' + (b || '(empty)')); };
    cmp('Full name', old.fullName, v.fullName); cmp('Short name', old.shortName, v.shortName); cmp('Link', old.link, v.link);
    cmp('Description', old.desc, v.desc || ''); cmp('Minutes', old.minutes, v.minutes || ''); cmp('When to do it', old.timing, v.timing);
    cmp('Advisor notes', old.advisorNotes, v.advisorNotes || '');
    cmp('Deadline', old.deadline, v.deadline); cmp('Audience', old.audience.slice().sort().join(', '), picked.slice().sort().join(', '));
    cmp('Exclusions', old.sets.slice().sort().join(', '), (v.sets || []).slice().sort().join(', ')); cmp('Period', old.period, v.period);
    cmp('Tab name', old.tabName, newTab); cmp('Status', old.status, v.status);
    if (!changes.length) return { ok: false, problems: ['Nothing has changed.'] };
    let warn = '';
    if (hcNew !== hcOld) warn = '\n*** THE DENOMINATOR CHANGES ***\n    HC assigned: ' + hcOld + '  ->  ' + hcNew + '  (' + (hcNew > hcOld ? '+' : '') + (hcNew - hcOld) + ')\n    The completion rate for this course WILL move.\n';
    if (newTab !== old.tabName) warn += '\n*** THE TAB WILL BE RENAMED ***\n    "' + old.tabName + '"  ->  "' + newTab + '"\n';
    return { ok: true, summary: 'EDIT ' + old.id + '  (registry row ' + old._row + ')\n\n' + changes.join('\n') + '\n' + warn };
  }
  API.portalReview = (name, v) => name === 'editCourse' ? reviewEdit(v) : reviewCourse(v || {});

  API.portalSubmit = function (name, v) {
    if (name === 'newCourse') {
      const chk = reviewCourse(v); if (!chk.ok) throw err(chk.problems.join('\n'));
      const letter = nextColumnLetter();
      const c = { id: String(v.id).trim().toUpperCase(), fullName: String(v.fullName).trim(), shortName: String(v.shortName).trim(),
        link: String(v.link || '').trim(), deadline: v.deadline, audience: (v.audience || []).slice(), sets: (v.sets || []).slice(),
        period: String(v.period).trim(), tabName: String(v.tabName).trim(), status: 'Active', desc: String(v.desc || '').trim(),
        minutes: Number(v.minutes) || '', timing: String(v.timing || ''), timingDetail: v.timing === 'Other' ? String(v.timingDetail || '').trim() : '',
        advisorNotes: String(v.advisorNotes || '').trim(), published: TODAY };
      S.registry.push(c);
      S.exports[c.tabName] = [];
      const row = S.registry.length + 1;
      const built = 'Tab "' + c.tabName + '" created\nColumn ' + letter + ' added to Mod level data\nRow ' + (2 + S.registry.length) + ' used on Overall Site completion';
      log_('Create a new eLearning', c.id + ' \u2014 registry row ' + row + '; ' + built.replace(/\n/g, '; '));
      return 'Registry row ' + row + ' created.\n\n' + built + '\n\nNext:\n  1. Paste the Skilljar export into "' + c.tabName + '"\n  2. Run the health check\n  3. Check HC Assigned matches what you expect';
    }
    if (name === 'editCourse') {
      const chk = reviewEdit(v); if (!chk.ok) throw err(chk.problems.join('\n'));
      const c = course(v.id);
      const newTab = String(v.tabName).trim();
      if (newTab !== c.tabName) {
        ['exports', 'archive'].forEach(k => { if (Object.prototype.hasOwnProperty.call(S[k], c.tabName)) { S[k][newTab] = S[k][c.tabName]; delete S[k][c.tabName]; } });
      }
      Object.assign(c, { fullName: String(v.fullName).trim(), shortName: String(v.shortName).trim(), link: String(v.link || '').trim(),
        deadline: v.deadline, audience: (v.audience || []).slice(), sets: (v.sets || []).slice(), period: String(v.period).trim(),
        tabName: newTab, status: String(v.status).trim(), desc: String(v.desc || '').trim(), minutes: Number(v.minutes) || '',
        timing: String(v.timing || ''), timingDetail: v.timing === 'Other' ? String(v.timingDetail || '').trim() : '',
        advisorNotes: String(v.advisorNotes || '').trim() });
      log_('Edit an eLearning', c.id + ' \u2014 ' + chk.summary.replace(/\n/g, ' | '));
      return 'Registry row ' + (S.registry.indexOf(c) + 2) + ' updated.\n\nEverything downstream recalculates from here.\nCheck the Overall tab and run the health check.';
    }
    let detail;
    if (name === 'courseExclusion') {
      course(v.courseId);
      S.courseExcl.push({ courseId: v.courseId, name: v.modName, reason: v.reason, addedBy: v.addedBy, date: TODAY });
      detail = v.modName + ' excluded from ' + v.courseId + ' \u2014 ' + v.reason;
    } else if (name === 'exclusionSet') {
      S.exclSets.push({ set: String(v.setName).trim(), name: v.modName, reason: v.reason });
      detail = v.modName + ' added to set ' + v.setName + ' \u2014 ' + v.reason;
    } else if (name === 'timeOff') {
      S.loa.push({ name: v.modName, from: v.from, to: v.to, official: v.official, reason: v.reason, addedBy: v.addedBy });
      detail = v.modName + ' on leave ' + v.from + ' to ' + v.to + ' (official: ' + v.official + ')';
    } else throw err('Unknown form: ' + name);
    log_(FORMS[name].title, detail);
    return detail;
  };

  API.portalDeleteCourse = function (id, typed) {
    const want = String(id).trim().toUpperCase();
    if (String(typed).trim().toUpperCase() !== want) throw err('The Course ID you typed does not match. Nothing was deleted.');
    const c = course(want);
    S.registry.splice(S.registry.indexOf(c), 1);
    delete S.exports[c.tabName]; delete S.archive[c.tabName];
    S.courseExcl = S.courseExcl.filter(r => r.courseId !== want);
    S.clientRoster = S.clientRoster.filter(x => x !== want);
    log_('Delete an eLearning', want + ' deleted from the portal');
    return want + ' has been deleted.';
  };

  // ---------------------------------------------------------------- chasing
  function fill(t, d) {
    return String(t).replace(/\{\{name\}\}/g, d.name).replace(/\{\{course\}\}/g, d.course).replace(/\{\{deadline\}\}/g, d.deadline)
      .replace(/\{\{link\}\}/g, d.link).replace(/\{\{days_overdue\}\}/g, d.days);
  }
  API.portalPrepareEmails = function (courseId) {
    const c = loadCourse_(courseId);
    if (!c.deadline) throw err('That course has no deadline.');
    if (TODAY <= c.deadline) return { rows: [], message: 'The deadline is ' + c.deadline + '. Nobody is late yet.' };
    const days = daysBetween(c.deadline, TODAY);
    const detail = API.getCourseDetail(c.id);
    const rows = [], skipped = { loa: 0, noid: 0, noemail: 0, pending: 0 };
    detail.people.forEach(function (p) {
      if (p.state !== 'overdue') { skipped[p.state] = (skipped[p.state] || 0) + 1; return; }
      if (!p.email || p.email.indexOf('@') === -1) { skipped.noemail++; return; }
      const d = { name: p.name.split(' ')[0], course: c.fullName, deadline: c.deadline, link: c.link, days: days };
      rows.push({ send: true, name: p.name, email: p.email, manager: p.manager, courseId: c.id, days: days,
                  subject: fill(S.template.subject, d), body: fill(S.template.body, d) });
    });
    return { rows: rows, skipped: skipped, message: rows.length + ' people are overdue on ' + c.id + '.' };
  };
  API.portalSendEmails = function (rows) {
    const test = S.config.MODE !== 'LIVE';
    rows.forEach(r => S.sent.push({ ts: nowStamp(), courseId: r.courseId, name: r.name, email: r.email, by: S.me.email, mode: S.config.MODE }));
    log_('Send chasing emails', rows.length + ' sent' + (test ? ' (test, to self)' : ''));
    return { sent: rows.length, failed: [], test: test, to: S.me.email + ' \u2014 demo: nothing actually leaves this page' };
  };
  API.getEmailTemplate = () => ({ subject: S.template.subject, fromName: S.template.fromName, body: S.template.body });
  API.saveEmailTemplate = function (t) {

  // ------------------------------------------------------------------- undo
  const UNDOABLE = {
    'Add a one-off exclusion': { key: 'courseExcl', name: r => r.name },
    'Add someone to an exclusion set': { key: 'exclSets', name: r => r.name },
    'Mark someone on leave': { key: 'loa', name: r => r.name },
    'Access override': { key: 'overrides', name: r => r.email },
  };
  API.peekUndo = function () {
    if (!S.log.length) return { found: false, why: 'The log is empty.' };
    for (let i = S.log.length - 1; i >= 0; i--) {
      const r = S.log[i];
      if (r.result !== 'OK' || r.user === 'trigger') continue;
      if (r.action.indexOf('Undo') === 0) return { found: false, why: 'The last action was already an undo. Nothing to undo again.' };
      if (!UNDOABLE[r.action]) return { found: false, why: 'The last change was "' + r.action + '", which cannot be undone here.\n\nDeletes, sent emails and course creation are not reversible from the portal. Use the spreadsheet\'s version history if you need to recover something.' };
      return { found: true, action: r.action, details: r.details, when: r.ts, by: r.user };
    }
    return { found: false, why: 'No undoable action found in the log.' };
  };
  API.doUndo = function () {
    const peek = API.peekUndo();
    if (!peek.found) throw err(peek.why);
    const spec = UNDOABLE[peek.action];
    const arr = S[spec.key];
    if (!arr.length) throw err('The target tab is empty \u2014 nothing to remove.');
    const nameInRow = spec.name(arr[arr.length - 1]);
    if (nameInRow && peek.details.indexOf(nameInRow) === -1) {
      throw err('Safety stop: the last row of the tab is for "' + nameInRow + '", which does not match the logged action:\n\n' + peek.details + '\n\nSomeone may have changed the sheet since. Remove the row by hand if you are sure.');
    }
    arr.pop();
    if (spec.key === 'overrides') S.config.ACCESS_VERSION++;
    log_('Undo', 'reversed: ' + peek.action + ' \u2014 ' + peek.details);
    return 'Undone: ' + peek.details;
  };

  // ----------------------------------------------------------------- import
  API.importSkilljar = function (courseId, raw, step) {
    const c = course(courseId);
    if (!c.tabName) throw err('That course has no tab name in the registry.');
    const lines = String(raw || '').replace(/\r/g, '').split('\n').filter(l => l.trim() !== '');
    if (lines.length < 2) throw err('That does not look like an export. Paste the whole thing, including the header row.');
    const headers = lines[0].split('\t').map(h => h.trim().toLowerCase());
    const idx = n => headers.indexOf(n.toLowerCase());
    const iF = idx('First name'), iL = idx('Last name'), iU = idx('User ID'), iP = idx('% complete'), iD = idx('Completed at'), iE = idx('Email');
    const missing = [];
    if (iF < 0) missing.push('First name'); if (iL < 0) missing.push('Last name'); if (iU < 0) missing.push('User ID');
    if (iP < 0) missing.push('% complete'); if (iD < 0) missing.push('Completed at');
    if (missing.length) throw err('These columns are missing from what you pasted:\n  ' + missing.join('\n  ') + '\n\nDid you copy the whole export, with its header row?');
    const out = []; let done = 0, enrolled = 0, skipped = 0;
    for (let i = 1; i < lines.length; i++) {
      const f = lines[i].split('\t');
      const uid = (f[iU] || '').trim();
      if (!uid) { skipped++; continue; }
      const pctRaw = (f[iP] || '').trim();
      const pct = pctRaw === '' ? 0 : Number(pctRaw.replace('%', ''));
      const rawDone = (f[iD] || '').trim();
      out.push({ name: ((f[iF] || '').trim() + ' ' + (f[iL] || '').trim()).trim(), uid: uid, email: iE >= 0 ? (f[iE] || '').trim() : '',
                 pct: isNaN(pct) ? 0 : pct, completedAt: rawDone.length >= 10 ? rawDone.slice(0, 16) : '' });
      if (!isNaN(pct) && pct > 0) done++; else enrolled++;
    }
    if (!out.length) throw err('No usable rows found in what you pasted.');
    const assigned = {};
    S.people.forEach(p => { if (p.uid && cell(c, p) !== '') assigned[p.uid] = 1; });
    const overlap = out.filter(r => assigned[r.uid]).length;
    const overlapPct = Math.round(overlap / out.length * 100);
    if (step === 'preview') {
      return { course: c.id, courseName: c.fullName, tab: c.tabName, total: out.length, done: done, enrolled: enrolled, skipped: skipped,
        overlap: overlap, overlapPct: overlapPct,
        warn: overlap === 0 ? 'None of these people are assigned to ' + c.id + '. This may be the WRONG export.'
          : overlapPct < 25 ? 'Only ' + overlapPct + '% of these people are assigned to ' + c.id + '. Double-check this is the right export.' : '' };
    }
    if (c.status === 'Archived' && Object.prototype.hasOwnProperty.call(S.archive, c.tabName)) S.archive[c.tabName] = out;
    else S.exports[c.tabName] = out;
    log_('Import Skilljar export', c.id + ' -> "' + c.tabName + '": ' + out.length + ' rows, ' + done + ' completed');
    return { committed: true, course: c.id, tab: c.tabName, total: out.length, done: done };
  };
  /** Demo helper (not in Code.gs): a realistic raw export for a course, with some new completions. */
  API._sampleExport = function (courseId) {
    const c = course(courseId);
    const prev = {}; (exportRows(c) || []).forEach(r => { prev[r.uid] = r; });
    const lines = ['First name\tLast name\tEmail\tUser ID\t% complete\tCompleted at\tEnrolled at'];
    let k = 0;
    S.people.forEach(function (p) {
      if (!p.uid || cell(c, p) === '') return;
      const r = prev[p.uid];
      let pct = r ? r.pct : 0, at = r ? r.completedAt : '';
      if (!pct && (k++ % 3 === 0)) { pct = 100; at = TODAY + ' 09:' + p2(10 + (k % 50)); }
      const parts = p.name.split(' ');
      lines.push([parts[0], parts.slice(1).join(' '), p.email, p.uid, pct, at, c.published + ' 08:00'].join('\t'));
    });
    lines.push(['Guest', 'Learner', 'guest@example.com', '', '0', '', c.published + ' 08:00'].join('\t'));

        else if (p.state === 'excused') excused++; else onTime++;

  function teamOfName(name) { const r = S.adminDoc.find(x => x.name === name); return r ? r.team : ''; }
  function apmRows(courses) {
    return S.apmRoster.map(function (a) {
      const team = teamOfName(a.name) || a.team;
      const mgrs = S.people.filter(p => (p.role === 'APM' || p.role === 'PM') && p.team === team).map(p => p.name);
      const hcPeople = S.people.filter(p => mgrs.indexOf(p.name) !== -1 || mgrs.indexOf(p.manager) !== -1);
      const lob = (hcPeople.find(p => p.role === 'MOD') || {}).lob || '';
      const cells = courses.map(function (c) {
        let as = 0, dn = 0;
        hcPeople.forEach(p => { const x = cell(c, p); if (x === '') return; as++; if (x === true || manualOf(c.id, p.name)) dn++; });
        return as ? Math.round(dn / as * 100) + '%' : '';
      });
      return { apm: a.name, team: team, lob: lob, hc: hcPeople.length, cells: cells };
    });

  // --------------------------------------------------------------- tracker
  API.getMissingFromTrackerList = function () {
    const tracked = {}; S.people.forEach(p => { tracked[p.name] = 1; });
    const exc = {}; S.trackerExc.forEach(t => { exc[t.name] = 1; });
    return S.adminDoc.filter(r => r.active && !tracked[r.name] && !exc[r.name] && !/^(WF|RTA)/.test(r.role) && r.lob !== 'WFM')
      .map(r => ({ name: r.name }));
  };
  API.addToTrackerExceptions = function (name, reason) {
    const n = String(name || '').trim();
    if (!n) throw err('No name given.');
    S.trackerExc.push({ name: n, reason: String(reason || '').trim(), by: S.me.email, date: TODAY });
    log_('Tracker exception', n + ' \u2014 ' + reason);
    return n + ' will no longer be flagged as missing from the tracker.';
  };
  API.getTrackerExceptions = () => S.trackerExc.map((t, i) => ({ row: i + 2, name: t.name, reason: t.reason, by: t.by, date: t.date }));
  API.removeTrackerException = function (row) {
    const i = Number(row) - 2;
    if (!(i >= 0) || !S.trackerExc[i]) throw err('Bad row.');
    const was = S.trackerExc.splice(i, 1)[0].name;
    log_('Tracker exception', 'removed ' + was);
    return was + ' will be flagged again if still missing.';
  };

  // --------------------------------------------------------- archive & misc
  API.getArchivableCourses = () => S.registry.map(c => ({ id: c.id, name: c.fullName, deadline: c.deadline, status: c.status, tabName: c.tabName,
    hasTab: Object.prototype.hasOwnProperty.call(S.exports, c.tabName), hasColumn: c.status === 'Active', alreadyArchived: c.status.toLowerCase() === 'archived' }));
  API.archiveCourses = function (ids) {
    if (!ids || !ids.length) throw err('No courses selected.');
    return ids.map(function (id) {
      try {
        const c = course(id);
        if (c.status === 'Archived') return { id: id, ok: false, msg: 'already archived' };
        let moved = 'no export tab to move';
        if (Object.prototype.hasOwnProperty.call(S.exports, c.tabName)) { S.archive[c.tabName] = S.exports[c.tabName]; delete S.exports[c.tabName]; moved = 'tab copied to the archive, then removed here'; }
        c.status = 'Archived';
        log_('Archive an eLearning', id + ' \u2014 ' + moved + '; column snapshotted and cleared');
        return { id: id, ok: true, msg: moved + '; column snapshotted and cleared' };
      } catch (e) { return { id: id, ok: false, msg: e.message }; }
    });
  };
  API.unarchiveCourse = function (id) {
    const c = course(id);
    if (c.status !== 'Archived') throw err(id + ' is not archived.');
    if (Object.prototype.hasOwnProperty.call(S.archive, c.tabName)) { S.exports[c.tabName] = S.archive[c.tabName]; delete S.archive[c.tabName]; }
    c.status = 'Active';
    log_('Un-archive an eLearning', id);
    return id + ' is active again. Re-import its Skilljar export if needed.';
  };
  API.refreshMirrorsNow = function () {
    const d = new Date();
    S.config.MIRROR_REFRESHED = TODAY + ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes());
    S.config.ACCESS_VERSION++;
    const summary = ['_Admin_Mirror: ' + S.adminDoc.length + ' rows', '_Annot_Mirror: ' + S.annot.length + ' rows'];
    log_('Refresh mirrors', summary.join('; '));
    return 'Mirrors refreshed: ' + summary.join('; ');
  };
  API.submitFeedback = function (text, category) {
    const t = String(text || '').trim();
    if (!t) throw err('Please write something before sending.');
    if (t.length > 4000) throw err("That's a lot \u2014 please keep it under 4000 characters.");
    const d = new Date();
    S.feedback.unshift({ when: TODAY + ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes()), category: String(category || 'General'), text: t });
    touch();          // deliberately not logged: feedback is anonymous
    return 'Thank you \u2014 sent anonymously.';
  };
  API.getFeedback = () => S.feedback.slice();

  // ------------------------------------------------------------------ host
  G.ELP_SERVER = {
    api: API,
    hooks: hooks,
    load: function (state) { S = state; TODAY = state.generatedFor; VERSION = 0; },
    state: () => S,
    version: () => VERSION,
    today: () => TODAY,
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* eLearning Portal — portfolio demo
 * shim.js — stands in for google.script.run so the real portal front end runs
 * unchanged against server.js. Also: persistence on this device, report pages
 * rendered as sheet-style views, and the small "Demo" panel.                */
(function () {
  'use strict';
  var KEY = 'elp-portfolio-demo-v1';
  function localISO(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  var TODAY = localISO(new Date());

  function fresh() { return ELP_MOCK.build(TODAY); }
  function loadState() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) { var st = JSON.parse(raw); if (st && st.version === 1 && st.generatedFor === TODAY) return st; }
    } catch (e) { /* storage unavailable — start fresh */ }
    return fresh();
  }
  var savedAt = 0;
  function save() {
    if (ELP_SERVER.version() === savedAt) return;
    savedAt = ELP_SERVER.version();
    try { localStorage.setItem(KEY, JSON.stringify(ELP_SERVER.state())); } catch (e) { /* ignore */ }
  }
  ELP_SERVER.load(loadState());

  // ---------------------------------------------- report pages (sheet views)
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function col(n) { var s = ''; while (n > 0) { var m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; }
  ELP_SERVER.hooks.makeUrl = function (rep) {
    var width = rep.sections.reduce(function (w, s) { return Math.max(w, s.headers.length); }, 1);
    var rows = [], r = 1;
    function line(cells, cls) {
      var h = '<tr><th class="rn">' + (r++) + '</th>';
      for (var i = 0; i < width; i++) h += '<td class="' + (cls || '') + '">' + esc(cells[i]) + '</td>';
      rows.push(h + '</tr>');
    }
    line([rep.title], 'title');
    if (rep.intro) line([rep.intro], 'intro');
    rep.sections.forEach(function (s) {
      line([]);
      line([s.heading], 'sect');
      line(s.headers, 'hdr');
      s.rows.forEach(function (x) { line(x); });
    });
    var head = '<tr><th class="corner"></th>';
    for (var i = 1; i <= width; i++) head += '<th>' + col(i) + '</th>';
    var html = '<!doctype html><html><head><meta charset="utf-8"><title>' + esc(rep.title) + ' — ' + esc(rep.book) + '</title>' +
      '<meta name="viewport" content="width=device-width,initial-scale=1">' +
      '<style>body{margin:0;font:13px Arial,Helvetica,sans-serif;color:#202124;background:#fff}' +
      '.bar{padding:10px 16px;border-bottom:1px solid #dadce0;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}' +
      '.bar b{font-size:16px;font-weight:500}.bar span{color:#5f6368;font-size:12px}' +
      '.wrap{overflow:auto;height:calc(100vh - 86px)}table{border-collapse:collapse;min-width:100%}' +
      'th,td{border:1px solid #e2e3e3;padding:4px 8px;white-space:nowrap;text-align:left}' +
      'thead th{background:#f8f9fa;color:#5f6368;font-weight:normal;text-align:center;position:sticky;top:0}' +
      '.rn{background:#f8f9fa;color:#5f6368;font-weight:normal;text-align:center;width:36px}.corner{width:36px}' +
      'td.title{font-size:15px;font-weight:bold}td.intro{color:#5f6368}td.sect{font-weight:bold;background:#e6f4ea}' +
      'td.hdr{font-weight:bold;background:#f1f3f4}' +
      '.tabs{position:fixed;bottom:0;left:0;right:0;background:#f1f3f4;border-top:1px solid #dadce0;padding:6px 16px;font-size:12px}' +
      '.tabs i{font-style:normal;background:#fff;padding:5px 12px;border-radius:0 0 4px 4px;color:#188038;font-weight:bold}</style></head><body>' +
      '<div class="bar"><b>' + esc(rep.book) + '</b><span>Mock report generated by the portfolio demo from fictional data</span></div>' +
      '<div class="wrap"><table><thead>' + head + '</tr></thead><tbody>' + rows.join('') + '</tbody></table></div>' +
      '<div class="tabs"><i>' + esc(rep.title) + '</i></div></body></html>';
    return URL.createObjectURL(new Blob([html], { type: 'text/html' }));
  };

  // --------------------------------------------------- google.script.run
  var SLOW = { getPortalData: 1, getCourseDetail: 1, getAccessOverview: 1, generateWeeklyClientReport: 1, generateApmBreakdown: 1, getMonthlyLateReport: 1, refreshMirrorsNow: 1 };
  function runner(ok, fail) {
    return new Proxy({}, {
      get: function (_, name) {
        if (name === 'withSuccessHandler') return function (h) { return runner(h, fail); };
        if (name === 'withFailureHandler') return function (h) { return runner(ok, h); };
        if (name === 'withUserObject') return function () { return runner(ok, fail); };
        return function () {
          var args = JSON.parse(JSON.stringify(Array.prototype.slice.call(arguments)));
          var wait = (SLOW[name] ? 650 : 280) + Math.random() * 350;
          setTimeout(function () {
            var fn = ELP_SERVER.api[name];
            var out, bad = null;
            try {
              if (!fn) throw new Error('Script function not found: ' + String(name));
              out = fn.apply(null, args);
              out = out === undefined ? undefined : JSON.parse(JSON.stringify(out));
            } catch (e) { bad = e instanceof Error ? e : new Error(String(e)); }
            save();
            if (bad) { if (fail) fail(bad); else console.error(bad); }
            else if (ok) ok(out);
          }, wait);
        };
      },
    });
  }
  window.google = { script: { run: runner(null, null) } };

  // ------------------------------------------------------------ demo panel
  function panel() {
    var css = document.createElement('style');
    css.textContent =
      '#demo-btn{position:fixed;right:18px;bottom:18px;z-index:50;font:600 11px "IBM Plex Mono",monospace;letter-spacing:.12em;' +
      'text-transform:uppercase;background:var(--ink);color:#fff;border:none;border-radius:999px;padding:9px 14px;cursor:pointer;' +
      'box-shadow:0 2px 10px rgba(19,26,33,.25)}#demo-btn:focus-visible,#demo-pop button:focus-visible{outline:2px solid var(--keep);outline-offset:2px}' +
      '#demo-pop{position:fixed;right:18px;bottom:62px;z-index:50;width:340px;max-width:calc(100vw - 36px);max-height:calc(100vh - 90px);overflow:auto;' +
      'background:var(--paper);border:1px solid var(--rule);border-radius:8px;box-shadow:0 8px 30px rgba(19,26,33,.18);padding:16px 16px 14px;display:none;' +
      'font-size:12.5px;line-height:1.5}#demo-pop h3{font-size:14px;font-weight:600;margin-bottom:6px}#demo-pop p{color:var(--muted);margin-bottom:10px}' +
      '#demo-pop .row{margin-top:12px;padding-top:12px;border-top:1px solid var(--rule)}#demo-pop label{display:block;font-weight:500;margin-bottom:5px}' +
      '#demo-pop select{width:100%;padding:6px;border:1px solid var(--rule);border-radius:5px;font:inherit;margin-bottom:6px}' +
      '#demo-pop textarea{width:100%;height:84px;font:11px "IBM Plex Mono",monospace;border:1px solid var(--rule);border-radius:5px;padding:6px;margin-top:6px;display:none}' +
      '#demo-pop button.d{font:inherit;font-weight:500;padding:6px 11px;border-radius:5px;border:1px solid var(--rule);background:var(--paper);cursor:pointer;margin-right:6px}' +
      '#demo-pop button.d:hover{background:var(--wash)}#demo-pop .ok{color:var(--safe);font-size:12px;margin-left:4px}';
    document.head.appendChild(css);
    var btn = document.createElement('button');
    btn.id = 'demo-btn'; btn.type = 'button'; btn.textContent = 'Demo'; btn.setAttribute('aria-expanded', 'false');
    var pop = document.createElement('div');
    pop.id = 'demo-pop'; pop.setAttribute('role', 'dialog'); pop.setAttribute('aria-label', 'About this demo');
    pop.innerHTML =
      '<h3>About this demo</h3>' +
      '<p>This is the real portal front end, running on a stand-in for its Apps Script back end. Every person, team and ID is fictional. ' +
      'Your changes stay in this browser and reset each day.</p>' +
      '<div class="row"><label for="demo-course">Sample Skilljar export</label>' +
      '<select id="demo-course"></select>' +
      '<button class="d" type="button" id="demo-copy">Copy to clipboard</button><span class="ok" id="demo-copied"></span>' +
      '<textarea id="demo-tsv" readonly aria-label="Sample export"></textarea>' +
      '<p style="margin:8px 0 0">Paste it into <b>Import Skilljar export</b> to watch the numbers move.</p></div>' +
      '<div class="row"><label>Mode</label><button class="d" type="button" id="demo-mode"></button></div>' +
      '<div class="row"><button class="d" type="button" id="demo-reset">Reset demo data</button></div>';
    document.body.appendChild(btn); document.body.appendChild(pop);
    function fillCourses() {
      var sel = document.getElementById('demo-course'); var cur = sel.value;
      sel.innerHTML = ELP_SERVER.state().registry.filter(function (c) { return c.status === 'Active'; })
        .map(function (c) { return '<option value="' + esc(c.id) + '">' + esc(c.fullName) + '</option>'; }).join('');
      if (cur) sel.value = cur;
    }
    function modeLabel() { document.getElementById('demo-mode').textContent = ELP_SERVER.state().config.MODE === 'LIVE' ? 'Switch to Sandbox' : 'Preview Live mode'; }
    btn.onclick = function () {
      var open = pop.style.display === 'block';
      pop.style.display = open ? 'none' : 'block'; btn.setAttribute('aria-expanded', String(!open));
      if (!open) { fillCourses(); modeLabel(); }
    };
    document.getElementById('demo-copy').onclick = function () {
      var tsv = ELP_SERVER.api._sampleExport(document.getElementById('demo-course').value);
      var ta = document.getElementById('demo-tsv'); ta.value = tsv; ta.style.display = 'block';
      var done = function () { document.getElementById('demo-copied').textContent = 'Copied'; };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(tsv).then(done, function () { ta.select(); });
      else { ta.select(); try { document.execCommand('copy'); done(); } catch (e) { /* user can copy by hand */ } }
    };
    document.getElementById('demo-mode').onclick = function () {
      var c = ELP_SERVER.state().config; c.MODE = c.MODE === 'LIVE' ? 'SANDBOX' : 'LIVE';
      ELP_SERVER.state().docName = c.MODE === 'LIVE' ? 'eLearning Tracker — LIVE' : 'eLearning Tracker — SANDBOX copy';
      try { localStorage.setItem(KEY, JSON.stringify(ELP_SERVER.state())); } catch (e) { /* ignore */ }
      modeLabel(); if (typeof boot === 'function') boot();
    };
    document.getElementById('demo-reset').onclick = function () {
      try { localStorage.removeItem(KEY); } catch (e) { /* ignore */ }
      ELP_SERVER.load(fresh()); savedAt = 0;
      pop.style.display = 'none'; btn.setAttribute('aria-expanded', 'false');
      if (typeof VIEWAS !== 'undefined') { VIEWAS = 'admin'; VIEWAS_PERSON = ''; }
      document.querySelector('.rail').style.display = 'flex';
      if (typeof boot === 'function') boot();
    };
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', panel); else panel();
})();

<script>
var D = null; // portal data
var VIEWAS = 'admin';
var VIEWAS_PERSON = ''; // when simulating a manager, which APM (by Slack name) to view as
var VIEWAS_APMS = null; // cached [{name, slack, team}] for the APM picker

var VALS = null;
var EMAILS = null;

var SETUP_OPEN = false; // is the "Setup & admin" rail section expanded
function toggleSetup() {
  SETUP_OPEN = !SETUP_OPEN;
  paintRail();
}
function pick(a) {
  return a[Math.floor(Math.random() * a.length)];
} // random line from a set
var RTA_LOADERS = [
  'Rounding up who to chase…',
  "Finding who's still outstanding…",
  'Pulling the chase list together…',
  'Spotting who to tag…',
]; // Per-form loading / checking / submitting lines. Forms not listed use the plain fallback.

  },
  editCourse: {

};
function formMsg(name, phase, fallback) {

} // ---------- boot ----------

    .withSuccessHandler(function (d) {

        '<div class="panel"><h1>Could not load</h1><p class="lede">' +

}
function switchViewAs() {

    .withSuccessHandler(function (d) {

      paintRail();
      if (d.me.role === 'self') {
        myLearnings();
        return;
      }
      show(d.me.role === 'rta' ? 'rtachase' : 'dash');

    .withFailureHandler(err(document.getElementById('main')))
    .getPortalData(VIEWAS, VIEWAS_PERSON);
}
function switchViewAsPerson() {

  google.script.run
    .withSuccessHandler(function (d) {
      D = d;
      paintRail();
      if (d.me.role === 'self') {
        myLearnings();

      }
      show(d.me.role === 'rta' ? 'rtachase' : 'dash');
    })
    .withFailureHandler(err(document.getElementById('main')))
    .getPortalData(VIEWAS, VIEWAS_PERSON);
} // Populates the "which APM?" picker under the role dropdown (manager view only).
function renderViewAsPerson() {
  var wrap = document.getElementById('viewAsPersonWrap');

    wrap.innerHTML =
      '<div style="font-size:11px;color:#fff;opacity:.85;margin-top:6px">Loading APMs…</div>';

      .withSuccessHandler(function (list) {

    opts +
    '</select>';
}
function timingLabel(t, detail) {
  if (!t) return '';
  if (t === 'Other') return detail ? 'Other: ' + detail : 'Other';
  return t;
}
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}
function paintRail() {
  var PARENT = {
    seemanual: 'markcomplete',
    excl: 'seeexcl',
    set: 'seeexcl',
    loa: 'leave',
    checkaccess: 'access',

  document.getElementById('doc').textContent = D.doc;

  document.getElementById('who').innerHTML =
    '<b>' +
    esc(D.me.email) +

    '<br>' +
    D.people +
    ' people' +
    (D.me.managers && D.me.managers.length ? ' — ' + esc(D.me.managers.join(', ')) : '');
  if (D.realRole === 'admin') {
    document.getElementById('viewAsWrap').innerHTML =
      '<select id="viewAsPicker" onchange="switchViewAs()" style="margin-top:8px;font-size:11px;' +
      'padding:4px 6px;border-radius:4px;border:none;width:100%">' +
      '<option value="admin"' +
      (VIEWAS === 'admin' ? ' selected' : '') +
      '>Viewing as: Admin</option>' +
      '<option value="manager"' +
      (VIEWAS === 'manager' ? ' selected' : '') +
      '>Viewing as: Manager</option>' +
      '<option value="rta"' +
      (VIEWAS === 'rta' ? ' selected' : '') +
      '>Viewing as: RTA</option>' +
      '<option value="self"' +
      (VIEWAS === 'self' ? ' selected' : '') +
      '>Viewing as: Self</option>' +
      '</select>' +
      '<div id="viewAsPersonWrap"></div>';
    renderViewAsPerson();
  } else {
    document.getElementById('viewAsWrap').innerHTML = '';
  } // no pinned Undo/Refresh unless we're painting the full admin rail below
  document.getElementById('railtools').innerHTML = ''; // RTA — its own minimal rail
  if (D.me.role === 'rta') {
    var h2 = '<div class="grp"><div class="eyebrow">Chasing</div>';
    h2 += nav(
      'rtachase',
      'Who to chase',

      '⚑',
    );

      'mine',
      'My eLearnings',
      'What I need to complete',
      'gv',
      "Your own to-do and completed eLearnings — nobody else's.",
      '★',
    );
    h2 += nav(
      'feedback',
      'Give feedback',
      'Anonymous, always welcome',
      'g6',
      'Send anonymous feedback about the portal — nobody will know it was you.',

    );
    h2 += nav(

    h +=

  h +=
    '<div class="rate"><span class="big">' +
    pct(c.done, a) +

    '<span class="sub">complete · <b>' +

    '<div class="meter">' +
    seg('ontime', c.onTime, a) +
    seg('late', c.late, a) +
    seg('excused', c.lateExcused, a) +
    seg('overdue', c.overdue, a) +
    seg('noid', c.noId, a) +
    seg('loa', c.loa, a) +
    seg('pending', c.pending, a) +

    '<div class="key">' +

    k('pending', 'Not due yet', c.pending) +
